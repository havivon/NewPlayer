name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NewPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NewPlayer-apk
          path: NewPlayer.apk

      # A download link that can be opened directly on the phone.
      - name: Publish to the "latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NewPlayer (latest build)
          prerelease: true
          files: NewPlayer.apk
